decision:
  id: ADR-001-audit-event-semantics
  version: 0.5
  status: proposed
  scope:
    contract: runtime.execution@1.0.0
    repositories:
      - Badreddine1982/vanguard-contracts
      - Badreddine1982/vanguard-runtime
      - Badreddine1982/vanguard-engineering-record

  context:
    observed_gap: >
      The initial runtime implementation did not expose or emit an observable
      audit event despite the proposed contract requiring one.
    historical_evidence:
      semantic_confirm_01: "failed on pinned runtime commit 9ed82687afe24615ad41894934efa78baf07b89b"
      preserved: true

  decision: selected_for_validation
  selected_option: runtime_emits_event
  design:
    runtime_owns_emission: true
    sink_owns_acceptance_and_persistence: true
    execution_result_returns_sink_reference: true
    event_fields:
      - request_id
      - action
      - success
      - error_code
    sink_failure_policy: "fail closed with AUDIT_SINK_FAILURE"
  rationale:
    - "The runtime execution contract explicitly requires an audit event, so the runtime must invoke the audit boundary."
    - "Persistence remains behind an injected sink; this avoids binding the runtime to a storage provider."
    - "The result returns a stable evidence reference without embedding the event payload in ExecutionResult."

  candidate_evidence:
    contract_commit: "1237f443606d2b06c10778fbe1293257d048874e"
    schema_commit: "56ff1979f32845f1c90e0b439d60744f8afef322"
    runtime_commit: "fa4365571612ce9e583af27174ca3322aad0b740"
    runtime_tests_commit: "de0c8429bd7a56f7ba616b90028bf70999bdfd2f"
    contracts_lock_commit: "3dae11c990ff9b919dfe60d2add3ded16acc2fbd"
    lifecycle_verifier_fix_commit: "18439a7d027be51f63bd96094af0173fdba1ec7c"
    semantic_confirmation:
      run_id: 40653461647
      run_number: 16
      conclusion: success
    runtime_workflow:
      run_id: 40653423350
      run_number: 34
      conclusion: success
    evidence_record:
      path: records/compatibility/runtime-execution-v1-semantic-confirm-02.yaml
      commit: "93976281291de79148af6adaff69e69e7b46b3d0"

  constraints:
    - "This is a candidate design under validation, not an adopted architecture."
    - "The sink must return a non-empty stable reference for accepted events."
    - "A sink failure causes execution to fail closed."
    - "Timeout behavior is not proven by checking only that timeout_ms is positive."
    - "Candidate contract API changes are treated as breaking until version policy is finalized before adoption."

  remaining_validation:
    - "Perform an independent candidate structural compatibility check against exact candidate commits."
    - "Confirm contract/schema/runtime versioning consistency."
    - "Contracts PR #1 is still mergeable=false; its branch is 11 commits ahead and 4 commits behind main. Four additional contract documents exist on main and must be preserved."
    - "Resolve contracts PR divergence and determine the actual mergeability cause before any merge."
    - "Review actual timeout enforcement as a separate requirement."
    - "Keep all three PRs unmerged until the review gate is satisfied."

  governance:
    evidence_status: "semantic_confirmed_runtime_workflow_passed_structural_review_pending"
    automatic_adoption: false
    real_contract_state_changed: false
    merge_authorized: false
