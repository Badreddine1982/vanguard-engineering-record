decision:
  id: ADR-001-audit-event-semantics
  version: 0.1
  status: proposed
  scope:
    contract: runtime.execution@1.0.0
    repositories:
      - Badreddine1982/vanguard-contracts
      - Badreddine1982/vanguard-runtime
      - Badreddine1982/vanguard-engineering-record

  context:
    contract_requirement: "audit_event_required: true"
    observed_runtime_candidate:
      branch: init/runtime-scaffold
      file: src/execution.py
      observation: "ExecutionResult exposes no audit-event field/reference, and execute() emits no visible audit record."
    existing_test_limitation: >
      SEMANTIC-CONFIRM-01 interprets observability as an attribute on
      ExecutionResult. The contract does not yet specify that representation,
      so the test detects a mismatch but does not by itself settle ownership.

  decision: unresolved
  options:
    - id: runtime_emits_event
      description: "The runtime emits a structured audit event through an explicit sink or callback."
    - id: result_carries_reference
      description: "ExecutionResult carries a stable reference to an independently persisted audit event."
    - id: orchestrator_owns_audit
      description: "The orchestrator owns audit persistence and the contract boundary specifies the required handoff."
  constraints:
    - "Do not add a result field solely to make CI pass."
    - "Define event owner, minimum fields, persistence/observability, and failure behavior before implementation."
    - "Keep the historical SEMANTIC-CONFIRM-01 failure as immutable evidence."
    - "Do not change adoption state automatically."
    - "Do not merge or adopt the contract as a consequence of this record."

  required_semantics_before_confirmation:
    - "Define which component is responsible for creating the event."
    - "Define the minimum event fields, including request correlation and outcome."
    - "Define whether the event must be persisted or merely emitted, and how tests observe it."
    - "Define behavior when audit emission or persistence fails."
    - "Test valid requests and deterministic failures against the chosen semantics."
    - "Pin exact contract and runtime commits for each confirmation result."

  next_actions:
    - "Inspect current runtime branch and adjacent architecture for an established audit sink or ownership boundary."
    - "Choose one option only after repository evidence supports it."
    - "Update contract/schema and runtime independently with rationale."
    - "Run semantic confirmation against the exact candidate commits."
    - "Investigate contracts PR mergeability and reconcile its four-commit divergence from main before merge review."

  governance:
    evidence_status: "open_question_with_observed_gap"
    automatic_adoption: false
    real_contract_state_changed: false
    merge_authorized: false
